version: "3.9"

services:
  # ─────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dialbridge}
      POSTGRES_USER: ${POSTGRES_USER:-dialbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dialbridge_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-dialbridge} -d ${POSTGRES_DB:-dialbridge}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - dialbridge_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ─────────────────────────────────────────
  # API (FastAPI) - PUBLIC SERVICE
  # ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    command: >
      sh -c "
        echo 'Waiting for DB...' &&
        sleep 5 &&
        echo 'Running migrations...' &&
        alembic upgrade head &&
        echo 'Starting API server...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      DEBUG: ${DEBUG:-false}
      BASE_URL: ${BASE_URL}

      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dialbridge}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dialbridge}
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379/0

      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}

    expose:
      - "8000"

    # 🔥 CRITICAL: Coolify routing
    labels:
      - "coolify.managed=true"
      - "coolify.type=application"
      - "coolify.port=8000"
      - "coolify.domains=dialbridge-api.abbasbhanpura.tech"

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - dialbridge_network

  # ─────────────────────────────────────────
  # Celery Worker
  # ─────────────────────────────────────────
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.background.celery_app worker --loglevel=info --concurrency=4

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dialbridge}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dialbridge}
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379/0

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

    networks:
      - dialbridge_network

  # ─────────────────────────────────────────
  # Celery Beat
  # ─────────────────────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.background.celery_app beat --loglevel=info

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dialbridge}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dialbridge}
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379/0

    volumes:
      - celerybeat_data:/app/celerybeat-schedule

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

    networks:
      - dialbridge_network

# ─────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  celerybeat_data:

# ─────────────────────────────────────────
# Network
# ─────────────────────────────────────────
networks:
  dialbridge_network:
    driver: bridge
