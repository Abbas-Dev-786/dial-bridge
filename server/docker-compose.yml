version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dialbridge
      POSTGRES_USER: dialbridge
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
